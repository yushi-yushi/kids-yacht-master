<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>キッズ・ヨット・マスター（操船強化版）</title>
    <style>
        /* 基本レイアウトの設定 */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            background-color: #1E90FF;
        }
        /* スコアや速度などの情報を表示するエリア */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 18px; color: #FFD700; }
        p { margin: 2px 0; font-size: 14px; }

        /* 風向きインジケーターの設定 */
        #wind-container {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #wind-indicator {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        #arrow {
            font-size: 30px;
            font-weight: bold;
            color: #FFD700;
            transition: transform 0.1s;
        }
        .label { color: white; font-size: 10px; font-weight: bold; margin-top: 4px; }

        /* セール状態ゲージ */
        #sail-gauge-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid white;
            border-radius: 15px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 10;
        }
        #sail-gauge-fill {
            width: 100%;
            height: 0%;
            background: #FF6347;
            border-radius: 10px;
            transition: height 0.3s ease;
        }
        #sail-gauge-label {
            position: absolute;
            top: -25px;
            color: white;
            font-size: 10px;
            white-space: nowrap;
            font-weight: bold;
        }

        /* 下部の操作ボタンエリア */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        .btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.4);
            border: 3px solid white;
            border-radius: 50%;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: white;
        }
        
        .btn:active, .btn.pressed {
            background: rgba(255, 215, 0, 0.8);
            transform: scale(0.9);
        }

        /* タック・ジャイブボタンのスタイル（サイズを大きく調整） */
        .special-btns {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .btn-small {
            width: 85px; /* 65pxから拡大 */
            height: 45px; /* 40pxから拡大 */
            font-size: 13px;
            font-weight: bold;
            border-radius: 12px;
            background: rgba(30, 144, 255, 0.6);
        }

        /* セール操作用ボタン */
        .sail-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        #btn-sail {
            width: 90px;
            height: 70px;
            background: rgba(255, 69, 0, 0.7);
            font-size: 14px;
            font-weight: bold;
            border-radius: 35px;
            flex-direction: column;
            text-align: center;
        }
        #btn-sail.active { background: #FFD700; color: #333; }
        
        #btn-release {
            width: 90px;
            height: 45px;
            background: rgba(100, 100, 100, 0.7);
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            text-align: center;
        }

        /* ヘルプボタン */
        #btn-help {
            position: absolute;
            bottom: 220px; 
            left: 30px;
            width: 50px;
            height: 50px;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 25;
        }

        /* ヘルプ表示用のモーダル */
        #help-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 100;
            color: #333;
        }
        #help-modal h2 { margin-top: 0; color: #1E90FF; text-align: center; }
        #help-modal ul { padding-left: 20px; }
        #help-modal li { margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
        #close-help {
            display: block;
            margin: 20px auto 0;
            padding: 10px 30px;
            background: #1E90FF;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 90;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>★キッズ・ヨット・マスター</h1>
        <p>スコア: <span id="score">0</span></p>
        <p>スピード: <span id="speed">0</span> km/h</p>
        <p id="msg" style="color: #FF6347; font-weight: bold;"></p>
    </div>

    <div id="wind-container">
        <div id="wind-indicator"><div id="arrow">↑</div></div>
        <div class="label">かぜのむき</div>
    </div>

    <!-- セールゲージ -->
    <div id="sail-gauge-container">
        <div id="sail-gauge-label">セール</div>
        <div id="sail-gauge-fill"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="btn-help" class="btn">？</div>

    <div id="controls">
        <div style="display:flex; flex-direction: column;">
            <div class="special-btns">
                <div id="btn-tack" class="btn btn-small">タック(T)</div>
                <div id="btn-gybe" class="btn btn-small">ジャイブ(J)</div>
            </div>
            <div style="display:flex; gap:15px; align-items: flex-end;">
                <div id="btn-left" class="btn">◀</div>
                <div id="btn-right" class="btn">▶</div>
            </div>
        </div>
        <div class="sail-btns">
            <div id="btn-sail" class="btn">⛵ GO!<br><span style="font-size:10px;">(Space)</span></div>
            <div id="btn-release" class="btn">減速<br><span style="font-size:10px;">(Down)</span></div>
        </div>
    </div>

    <div id="overlay"></div>
    <div id="help-modal">
        <h2>あそびかた</h2>
        <ul>
            <li><strong>【GO! / Space】</strong>でセールを はるよ！</li>
            <li><strong>【減速 / ↓】</strong>でセールを たたんで 止まるよ。</li>
            <li><strong>【タック / T】</strong>は 風上（かざかみ）を 通って むきを かえるよ。</li>
            <li><strong>【ジャイブ / J】</strong>は 風下（かざしも）を 通って むきを かえるよ。</li>
            <li><strong>【◀ ▶】</strong>は ハンドルを きるよ。</li>
            <li>かぜを よこから うけると スピードが アップ！ ⛵✨</li>
        </ul>
        <button id="close-help">わかった！</button>
    </div>

<script>
    /**
     * システム管理・初期化
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    /**
     * ヘルプ画面制御
     */
    const helpBtn = document.getElementById('btn-help');
    const helpModal = document.getElementById('help-modal');
    const helpOverlay = document.getElementById('overlay');
    const closeHelp = document.getElementById('close-help');

    const toggleHelp = (show) => {
        const display = show ? 'block' : 'none';
        helpModal.style.display = display;
        helpOverlay.style.display = display;
    };

    helpBtn.addEventListener('click', () => toggleHelp(true));
    helpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleHelp(true); });
    closeHelp.addEventListener('click', () => toggleHelp(false));
    helpOverlay.addEventListener('click', () => toggleHelp(false));

    /**
     * ゲーム状態
     */
    let score = 0;
    const boat = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        angle: -Math.PI / 2,
        speed: 0,
        maxSpeed: 6,
        rotationSpeed: 0.05,
        sailOpen: false,
        autoRotateDir: 0, 
        autoRotateTarget: null
    };

    const windAngle = Math.PI / 2; // 北風（上から下）

    const star = {
        x: Math.random() * (window.innerWidth - 100) + 50,
        y: Math.random() * (window.innerHeight - 100) + 50,
        size: 18
    };

    const input = { left: false, right: false };

    /**
     * 旋回ロジック（タック・ジャイブ）
     */
    function startSpecialMove(type) {
        // 現在の風に対する角度を確認
        let diff = Math.atan2(Math.sin(boat.angle - windAngle), Math.cos(boat.angle - windAngle));
        
        if (type === 'tack') {
            // タック：風上を回る
            boat.autoRotateDir = (diff < 0) ? 1 : -1;
            boat.autoRotateTarget = boat.angle + boat.autoRotateDir * Math.PI * 0.5;
        } else if (type === 'gybe') {
            // ジャイブ：風下を回る
            boat.autoRotateDir = (diff < 0) ? -1 : 1;
            boat.autoRotateTarget = boat.angle + boat.autoRotateDir * Math.PI * 0.5;
        }
    }

    /**
     * 入力イベント処理
     */
    // キーボード
    window.addEventListener('keydown', (e) => {
        const key = e.code;
        if(key === 'ArrowLeft') { input.left = true; boat.autoRotateDir = 0; }
        if(key === 'ArrowRight') { input.right = true; boat.autoRotateDir = 0; }
        if(key === 'Space' || key === 'ArrowUp') boat.sailOpen = true;
        if(key === 'ArrowDown') boat.sailOpen = false;
        
        // 特殊操船ショートカット
        if(key === 'KeyT') startSpecialMove('tack');
        if(key === 'KeyJ') startSpecialMove('gybe');
    });
    
    window.addEventListener('keyup', (e) => {
        if(e.code === 'ArrowLeft') input.left = false;
        if(e.code === 'ArrowRight') input.right = false;
    });

    // ボタンUI
    function setupDirBtn(id, key) {
        const btn = document.getElementById(id);
        const start = (e) => { 
            e.preventDefault(); 
            input[key] = true; 
            btn.classList.add('pressed'); 
            boat.autoRotateDir = 0; 
        };
        const end = (e) => { 
            e.preventDefault(); 
            input[key] = false; 
            btn.classList.remove('pressed'); 
        };
        btn.addEventListener('touchstart', start, {passive: false});
        btn.addEventListener('touchend', end, {passive: false});
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
        btn.addEventListener('mouseleave', end);
    }
    setupDirBtn('btn-left', 'left');
    setupDirBtn('btn-right', 'right');

    const sailBtn = document.getElementById('btn-sail');
    const releaseBtn = document.getElementById('btn-release');
    const tackBtn = document.getElementById('btn-tack');
    const gybeBtn = document.getElementById('btn-gybe');

    sailBtn.addEventListener('click', () => boat.sailOpen = true);
    sailBtn.addEventListener('touchstart', (e) => { e.preventDefault(); boat.sailOpen = true; });
    releaseBtn.addEventListener('click', () => boat.sailOpen = false);
    releaseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); boat.sailOpen = false; });
    
    tackBtn.addEventListener('click', () => startSpecialMove('tack'));
    gybeBtn.addEventListener('click', () => startSpecialMove('gybe'));

    /**
     * 更新処理
     */
    function update() {
        // 自動旋回
        if (boat.autoRotateDir !== 0) {
            boat.angle += boat.rotationSpeed * boat.autoRotateDir;
            if (Math.abs(boat.angle - boat.autoRotateTarget) < 0.1) {
                boat.autoRotateDir = 0;
            }
        }

        // 手動旋回
        if (input.left) boat.angle -= boat.rotationSpeed;
        if (input.right) boat.angle += boat.rotationSpeed;

        // 風との角度計算
        let diff = Math.atan2(Math.sin(boat.angle - windAngle), Math.cos(boat.angle - windAngle));
        let absDiff = Math.abs(diff);

        let windEfficiency = 0;
        let msg = "";

        // ヨットの帆走物理
        if (absDiff > Math.PI * 0.75) {
            windEfficiency = -0.5;
            msg = "かぜに むかいすぎ！";
        } else if (absDiff > Math.PI * 0.4) {
            windEfficiency = 1.2;
        } else if (absDiff < Math.PI * 0.15) {
            windEfficiency = 0.7;
        } else {
            windEfficiency = 1.0;
        }

        if (boat.sailOpen) {
            boat.speed += 0.08 * windEfficiency;
            sailBtn.classList.add('active');
        } else {
            boat.speed *= 0.97;
            sailBtn.classList.remove('active');
        }

        if (boat.speed > boat.maxSpeed) boat.speed = boat.maxSpeed;
        if (boat.speed < 0) boat.speed = 0;

        boat.x += Math.cos(boat.angle) * boat.speed;
        boat.y += Math.sin(boat.angle) * boat.speed;

        // ループ
        if (boat.x > canvas.width + 20) boat.x = -20;
        if (boat.x < -20) boat.x = canvas.width + 20;
        if (boat.y > canvas.height + 20) boat.y = -20;
        if (boat.y < -20) boat.y = canvas.height + 20;

        // アイテム取得
        let dx = boat.x - star.x;
        let dy = boat.y - star.y;
        if (Math.sqrt(dx*dx + dy*dy) < 35) {
            score++;
            document.getElementById('score').innerText = score;
            star.x = Math.random() * (canvas.width - 100) + 50;
            star.y = Math.random() * (canvas.height - 100) + 50;
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // UI
        document.getElementById('speed').innerText = Math.floor(boat.speed * 5);
        document.getElementById('msg').innerText = msg;
        const gaugeHeight = boat.sailOpen ? 100 : 0;
        document.getElementById('sail-gauge-fill').style.height = gaugeHeight + '%';
    }

    /**
     * 描画処理
     */
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 波背景
        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = 2;
        let time = Date.now() / 1000;
        for(let i=-2; i<10; i++) {
            let yOffset = (time * 50) % 200;
            let baseY = i * 200 + yOffset;
            ctx.beginPath();
            for(let x=0; x<canvas.width + 100; x+=30) {
                let waveY = baseY + Math.sin(x/100 + time) * 15;
                if (x === 0) ctx.moveTo(x, waveY);
                else ctx.lineTo(x, waveY);
            }
            ctx.stroke();
        }

        // 星
        ctx.save();
        ctx.fillStyle = "#FFD700";
        ctx.shadowColor = "white";
        ctx.shadowBlur = 15;
        ctx.beginPath();
        for(let i=0; i<5; i++) {
            ctx.lineTo(star.x + Math.cos((18+i*72)/180*Math.PI)*star.size, 
                       star.y + Math.sin((18+i*72)/180*Math.PI)*star.size);
            ctx.lineTo(star.x + Math.cos((54+i*72)/180*Math.PI)*star.size/2, 
                       star.y + Math.sin((54+i*72)/180*Math.PI)*star.size/2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 船体
        ctx.save();
        ctx.translate(boat.x, boat.y);
        ctx.rotate(boat.angle);

        ctx.fillStyle = "#F5F5F5";
        ctx.beginPath();
        ctx.moveTo(25, 0);
        ctx.bezierCurveTo(10, 15, -15, 15, -20, 10);
        ctx.lineTo(-20, -10);
        ctx.bezierCurveTo(-15, -15, 10, -15, 25, 0);
        ctx.fill();
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.strokeStyle = "#666";
        ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(10, 0); ctx.stroke();

        // 帆（セール）
        if (boat.sailOpen || boat.speed > 0.5) {
            let diff = Math.atan2(Math.sin(windAngle - boat.angle), Math.cos(windAngle - boat.angle));
            let sailAngle = diff / 2;
            if (Math.abs(diff) > Math.PI * 0.8) sailAngle = 0;

            ctx.save();
            ctx.rotate(sailAngle);
            ctx.globalAlpha = boat.sailOpen ? 1.0 : 0.4;
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.moveTo(8, 0);
            let curveWidth = boat.sailOpen ? (2 + boat.speed) : 1;
            ctx.quadraticCurveTo(-15, curveWidth, -25, 0);
            ctx.lineTo(8, 0);
            ctx.fill();
            ctx.strokeStyle = "#ddd";
            ctx.stroke();
            ctx.restore();
        }

        ctx.restore();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    document.getElementById('arrow').style.transform = `rotate(180deg)`;
    gameLoop();
</script>
</body>
</html>
